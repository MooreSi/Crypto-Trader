name: checks

# Runs the same command developers run locally (tools.checks all), on both
# platforms the app ships for, plus the dashboard's own tests and a check
# that the committed frontend/dist matches its source.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: tools.checks all
        env:
          PYTHONUTF8: "1"
        run: python -m tools.checks all

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "frontend/dist is stale: run npm run build and commit it" && exit 1)
