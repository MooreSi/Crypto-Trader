[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trader"
version = "0.1.0"
description = "Crypto Trader: automated Hyperliquid perpetuals trading with research engines, a risk governor and a React dashboard"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
# Kept in lockstep with requirements.txt (tests/refactor/test_dependencies.py).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "keyring>=25.0",
    "websockets>=13.0",
    "cryptography>=42.0",
    "psutil>=6.0.0",
    "tzdata>=2024.1",
    "hyperliquid-python-sdk==0.24.0",
]

[project.scripts]
crypto-trader = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
